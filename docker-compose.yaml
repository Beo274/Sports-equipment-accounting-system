services:
  postgres:
    image: postgres:17-alpine
    container_name: sports_eq_postgres
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - sports_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data_network

  liquibase:
    image: liquibase/liquibase:4.31.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/main/resources/db.changelog:/liquibase/changelog
    env_file:
      - .env

    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml

    command:
      - --search-path=/liquibase/changelog
      - update
    networks:
      - data_network

  sports-api:
    container_name: sports_eq_api
    build:
      dockerfile: ./deploy/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - JAVA_OPTS=-Xmx512m -Xms512m
    ports:
      - 8080:8080
    networks:
      - data_network
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_started

  web-app:
    container_name: sports_eq_web
    build:
      dockerfile: ./web/Dockerfile
    restart: unless-stopped
    ports:
      - 3000:3000
    networks:
      - data_network
    depends_on:
      - postgres
      - sports-api

volumes:
  sports_pgdata:
    driver: local

networks:
  data_network:
