services:
  postgres:
    image: postgres:16-alpine
    container_name: sports_eq_postgres
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - sports_pgdata:/var/lib/postgresql/data
      - ../migrations/postgres:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - data_network

volumes:
  sports_pgdata:
    driver: local

networks:
  data_network: