services:
  postgres:
    image: postgres:16-alpine
    container_name: sports_eq_postgres
    env_file:
      - .env
    ports:
      - 5433:5432
    volumes:
      - sports_pgdata:/var/lib/postgresql/data
      - ../migrations/postgres:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - data_network

  sports-api:
    container_name: sports_eq_api
    build:
      context: ../
      dockerfile: ./deploy/api/Dockerfile
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xmx512m -Xms512m
    volumes:
      - ./.env:/app/deploy/.env:ro
    ports:
      - 8080:8080
    networks:
      - data_network
    depends_on:
      - postgres


volumes:
  sports_pgdata:
    driver: local

networks:
  data_network: